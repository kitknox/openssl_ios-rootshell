#### visionOS and Mac Catalyst targets
#
# These targets are not included in upstream OpenSSL.
# This configuration file adds support for:
# - visionOS (Apple Vision Pro)
# - Mac Catalyst (iOS apps running on macOS)
#
my %targets = (
    #### visionOS
    "visionos-common" => {
        template         => 1,
        inherit_from     => [ "darwin-common" ],
        sys_id           => "visionOS",
        disable          => [ "async" ],
    },
    "visionos64-cross-arm64" => {
        inherit_from     => [ "visionos-common" ],
        CC               => "cc",
        cflags           => add("-arch arm64 -isysroot \"\$(CROSS_TOP)/SDKs/\$(CROSS_SDK)\" -fno-common"),
        bn_ops           => "SIXTY_FOUR_BIT_LONG",
        asm_arch         => 'aarch64',
        perlasm_scheme   => "ios64",
    },
    "visionos-sim-cross-arm64" => {
        inherit_from     => [ "visionos-common" ],
        CC               => "cc",
        cflags           => add("-arch arm64 -isysroot \"\$(CROSS_TOP)/SDKs/\$(CROSS_SDK)\" -fno-common"),
        bn_ops           => "SIXTY_FOUR_BIT_LONG",
        asm_arch         => 'aarch64',
        perlasm_scheme   => "ios64",
    },

    #### Mac Catalyst
    "maccatalyst-common" => {
        template         => 1,
        inherit_from     => [ "darwin-common" ],
        sys_id           => "MacOSX",
        disable          => [ "async" ],
    },
    "maccatalyst-xcrun-arm64" => {
        inherit_from     => [ "maccatalyst-common" ],
        CC               => "xcrun -sdk macosx cc",
        cflags           => add("-arch arm64 -target arm64-apple-ios14.0-macabi -fno-common"),
        bn_ops           => "SIXTY_FOUR_BIT_LONG",
        asm_arch         => 'aarch64',
        perlasm_scheme   => "ios64",
    },
    "maccatalyst-xcrun-x86_64" => {
        inherit_from     => [ "maccatalyst-common" ],
        CC               => "xcrun -sdk macosx cc",
        cflags           => add("-arch x86_64 -target x86_64-apple-ios14.0-macabi -fno-common"),
        bn_ops           => "SIXTY_FOUR_BIT_LONG",
        asm_arch         => 'x86_64',
        perlasm_scheme   => "macosx",
    },
);
